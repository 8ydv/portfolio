<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Menu</title>
<link rel="icon" type="image/png" href="media/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;600;700&family=Cairo:wght@300;400;600;700&family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;700&family=Josefin+Sans:wght@300;700&family=Bebas+Neue&family=Orbitron:wght@700&family=Italiana&family=Playfair+Display:wght@700&family=Cormorant+Garamond:wght@300;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<body>

<div id="cursor">
  <div id="cursor-outer"></div>
  <div id="cursor-inner"></div>
  <div id="cursor-corner-tl"></div>
  <div id="cursor-corner-tr"></div>
  <div id="cursor-corner-bl"></div>
  <div id="cursor-corner-br"></div>
</div>

<canvas id="bgCanvas"></canvas>

<div id="introScreen">
  <div class="intro-logo">
    <h1>Royal Menu</h1>
    <div class="intro-divider"></div>
    <div class="by-line">BY MÈDO</div>
  </div>
  <button class="enter-btn" onclick="enterSite()">
    <span class="btn-corner corner-tl"></span>
    <span class="btn-corner corner-tr"></span>
    <span class="btn-corner corner-bl"></span>
    <span class="btn-corner corner-br"></span>
    ENTER
  </button>
</div>

<div id="mainLayout">

  <div class="owner-card">
    <div class="owner-inner">
      <div class="card-corner tl"></div>
      <div class="card-corner tr"></div>
      <div class="card-corner bl"></div>
      <div class="card-corner br"></div>

      <div class="avatar-wrap">
  <div class="avatar-ring"></div>

  <div class="avatar-placeholder" id="avatarEl">
    <img src="media/IMG_6590.jpg" alt="Avatar"
    width="96" height="96"
    style="width:100%;height:100%;object-fit:cover;border-radius:50%;">
  </div>
</div>

<div class="owner-name-row">
  <div class="owner-name">Mèdo</div>

  <div class="verified-badge">

  </div>
</div>

<div class="owner-title">MENU DEVELOPER • ROYAL MENU</div>

<div class="divider-line"></div>

<div class="divider-line" style="margin-top:20px;"></div>
<div class="supported-label">SUPPORTED GAMES</div>
<div class="supported-platform">
  <img src="media\playstation-logotype_1443.png" alt="PlayStation" class="ps-logo-img">
</div>
<div class="supported-games-grid">
  <div class="game-tag">
    <span class="game-tag-dot"></span>
    WW2
  </div>
  <div class="game-tag">
    <span class="game-tag-dot"></span>
    MWR
  </div>
  <div class="game-tag">
    <span class="game-tag-dot"></span>
    AW
  </div>
  <div class="game-tag">
  <span class="game-tag-dot"></span>
  GHOST
</div>
  <div class="game-tag">
  <span class="game-tag-dot"></span>
  MW2CR
</div>
  <div class="game-tag">
  <span class="game-tag-dot"></span>
  IW
</div>
  <div class="game-tag">
  <span class="game-tag-dot"></span>
  MW2019
</div>
</div>

</div>
</div>

<div class="menu-panel">
  <div class="menu-container">

    <div class="menu-header">
      <h2>Royal Menu</h2>
      <div class="menu-by">By Mèdo</div>
    </div>

    <div class="menu-item" onclick="openItem(this, 'Main Mods', 'Access powerful gameplay modifications and advanced in-game features.')">
      <div class="menu-item-dot"></div>
      <span>Main Mods</span>
      <div class="menu-item-arrow">›</div>
    </div>

    <div class="menu-items" id="menuItems">

      <div class="menu-item" onclick="openItem(this, 'Weapon Menu', 'Choose from a full collection of weapons including rifles, SMGs, snipers and more.')">
        <div class="menu-item-dot"></div>
        <span>Weapon Menu</span>
        <div class="menu-item-arrow">›</div>
      </div>

      <div class="menu-item" onclick="openItem(this, 'Lobby Menu', 'Manage match settings, bots, streaks, XP lobbies and game controls.')">
        <div class="menu-item-dot"></div>
        <span>Lobby Menu</span>
        <div class="menu-item-arrow">›</div>
      </div>

      <div class="menu-item" onclick="openItem(this, 'Account Menu', 'Unlock ranks, prestige rewards, emblems and account customizations.')">
        <div class="menu-item-dot"></div>
        <span>Account Menu</span>
        <div class="menu-item-arrow">›</div>
      </div>

      <div class="menu-item" onclick="openItem(this, 'Fun Menu', 'Activate fun gameplay effects, teleportation tools and unique visual actions.')">
        <div class="menu-item-dot"></div>
        <span>Fun Menu</span>
        <div class="menu-item-arrow">›</div>
      </div>

      <div class="menu-item" onclick="openItem(this, 'Bullet Menu', 'Modify bullet behavior with explosive, laser, RPG and teleport effects.')">
        <div class="menu-item-dot"></div>
        <span>Bullet Menu</span>
        <div class="menu-item-arrow">›</div>
      </div>

      <div class="menu-item" onclick="openItem(this, 'Players Menu', 'Interact with players using teleportation, moderation and control features.')">
        <div class="menu-item-dot"></div>
        <span>Players Menu</span>
        <div class="menu-item-arrow">›</div>
      </div>

      <div class="menu-item" onclick="openItem(this, 'Cheaters Menu', 'Access advanced targeting tools, ESP features, UAV systems and combat enhancements.')">
        <div class="menu-item-dot"></div>
        <span>Cheaters Menu</span>
        <div class="menu-item-arrow">›</div>
      </div>

      <div class="menu-item" onclick="openItem(this, 'Message Menu', 'Send preset chat messages, alerts, reactions and custom in-game taunts instantly.')">
        <div class="menu-item-dot"></div>
        <span>Message Menu</span>
        <div class="menu-item-arrow">›</div>
      </div>

      <div class="menu-item" onclick="openItem(this, 'Theme Menu', 'Customize the menu appearance with premium themes and visual styles.')">
        <div class="menu-item-dot"></div>
        <span>Theme Menu</span>
        <div class="menu-item-arrow">›</div>
      </div>

    </div>
  </div>
</div>

<div class="overlay-backdrop" id="backdrop" onclick="closePopup()"></div>

<div class="content-popup" id="contentPopup">
  <button class="popup-close" onclick="closePopup()">✕</button>
  <div class="popup-title" id="popupTitle"></div>
  <div class="popup-desc" id="popupDesc"></div>
</div>

<div id="audioBar">

  <button class="audio-play-btn" id="playBtn" onclick="toggleAudio()">
    <svg id="playIcon" viewBox="0 0 12 12">
      <path d="M3 2l7 4-7 4z"/>
    </svg>

    <svg id="pauseIcon" viewBox="0 0 12 12" style="display:none">
      <rect x="2" y="2" width="3" height="8"/>
      <rect x="7" y="2" width="3" height="8"/>
    </svg>
  </button>

  <div class="audio-info">
    <div class="audio-title">BACKGROUND THEME</div>

    <div class="audio-bars" id="audioBars">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>
  </div>

  <div class="volume-wrap">
    <div class="volume-icon">
      <svg viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
    </div>

    <input type="range"
      class="volume-slider"
      id="volSlider"
      min="0"
      max="100"
      value="70"
      oninput="setVolume(this.value)"
      style="--val:70%">
  </div>

</div>

<audio id="bgAudio" loop preload="none">
  <source src="media/audio.mp3" type="audio/mpeg">
</audio>

<script src="js/script.js"></script>

</body>
</html>
