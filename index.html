<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Royal Menu — the all-in-one mod menu for PS4, by Mèdo.">
<title>Royal Menu</title>
<link rel="icon" href="media/favicon.svg" type="image/svg+xml">
<link rel="icon" href="media/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="media/apple-touch-icon.png">
<meta name="theme-color" content="#070707">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="vig"></div>
<div class="ghost" id="ghost" aria-hidden="true">MAIN</div>

<div id="intro">
  <div class="frame">
    <div class="head"><h1>Royal Menu</h1><small>By Mèdo</small></div>
    <div class="body">
      <p>The all-in-one mod menu for PS4.</p>
      <button class="btn" id="enter" autofocus><span>Enter Site</span><span>›</span></button>
    </div>
  </div>
</div>

<div class="app">
  <!-- LEFT: profile + links + games -->
  <div class="left">
    <div class="who">
      <div class="avatar" id="avatar">
          <div class="ph">M</div>
          <img id="avatarImg" alt="Mèdo profile picture" onerror="this.remove()">
          <span class="tint"></span><span class="scan"></span>
        </div>
      <div>
        <h1>Mèdo<span class="vf" role="img" aria-label="Verified"><svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/></svg></span></h1>
        <p class="role">Creator of Royal Menu</p>
      </div>
    </div>
    <div class="socials" id="socials"></div>
    <div class="games">
      <header><h2>Supported Games</h2><i>PS4</i></header>
      <div class="chips" id="chips"></div>
      <p class="gcap" id="gcap">11 titles · all on PS4</p>
    </div>
  </div>

  <!-- RIGHT: the menu -->
  <div class="stage" id="stage">
    <div id="tilt">
      <div class="frame" id="box" tabindex="0" aria-label="Royal Menu">
        <div class="head"><h2 id="mt">Royal Menu</h2><small>By Mèdo</small></div>
        <div class="list" id="list" role="menu"></div>
        <div class="info" id="info"></div>
        <div id="shine"></div>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM CENTRE: music player -->
<div id="player">
  <div class="frame">
    <div class="pl">
      <button class="pbtn" id="pp" aria-label="Play or pause"></button>
      <div class="pinfo"><b id="tn"></b><span>Now playing</span></div>
      <canvas id="viz" width="260" height="38"></canvas>
      <input type="range" id="vol" min="0" max="100" value="55" aria-label="Volume">
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
